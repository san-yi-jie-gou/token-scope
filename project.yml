name: TokenScope

options:
  bundleIdPrefix: tech.qidao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  TokenScope:
    type: application
    platform: macOS
    sources:
      - path: TokenScope
      - path: Shared
    dependencies:
      - target: TokenScopeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.qidao.app.tokenscope
        PRODUCT_NAME: TokenScope
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TokenScope
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/TokenScope.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 12
        MARKETING_VERSION: 1.0.0

  TokenScopeWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: TokenScopeWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.qidao.app.tokenscope.widget
        PRODUCT_NAME: TokenScopeWidget
        INFOPLIST_FILE: TokenScopeWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/TokenScopeWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 12
        MARKETING_VERSION: 1.0.0

  TokenScopeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TokenScopeTests
    dependencies:
      - target: TokenScope
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.qidao.app.tokenscope.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
