name: Build App Store Archive

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ARCHIVE_PATH: ${{ runner.temp }}/TokenScope-1.0.0-13.xcarchive
      ARCHIVE_ZIP: ${{ runner.temp }}/TokenScope-1.0.0-13-xcarchive.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild \
            -project TokenScope.xcodeproj \
            -scheme TokenScope \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-ci \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Create adhoc-signed archive
        run: |
          xcodebuild \
            -project TokenScope.xcodeproj \
            -scheme TokenScope \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Remove quarantine attributes
        run: |
          xattr -cr "$ARCHIVE_PATH"
          quarantine_matches="$(xattr -lr "$ARCHIVE_PATH" | grep -F 'com.apple.quarantine' || true)"
          if [[ -n "$quarantine_matches" ]]; then
            echo "::error::Archive still contains com.apple.quarantine attributes"
            echo "$quarantine_matches"
            exit 1
          fi

      - name: Record build environment
        run: |
          sw_vers
          xcodebuild -version
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$ARCHIVE_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :BuildMachineOSBuild' "$ARCHIVE_PATH/Products/Applications/TokenScope.app/Contents/Info.plist"
          codesign -d --entitlements :- "$ARCHIVE_PATH/Products/Applications/TokenScope.app"
          codesign -d --entitlements :- "$ARCHIVE_PATH/Products/Applications/TokenScope.app/Contents/PlugIns/TokenScopeWidget.appex"

      - name: Package archive
        run: |
          ditto -c -k --norsrc --keepParent \
            "$ARCHIVE_PATH" \
            "$ARCHIVE_ZIP"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: TokenScope-1.0.0-13-xcarchive
          path: ${{ runner.temp }}/TokenScope-1.0.0-13-xcarchive.zip
          retention-days: 3
          if-no-files-found: error
